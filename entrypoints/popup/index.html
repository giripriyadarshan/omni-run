<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omni-Run Dashboard</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .popup-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .popup-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    #storage-text {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .btn-action {
      width: 100%;
      padding: 8px 12px;
      background: #ef4444;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn-action:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="popup-app">
    <div class="popup-header">
      <h2 class="popup-title">Omni-Run Dashboard</h2>
    </div>
    <div class="card">
      <div class="card-title">OPFS Storage Quota</div>
      <div id="storage-text">Loading...</div>
    </div>
    <div class="card">
      <div id="assets-toggle" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
        <div class="card-title" style="margin-bottom: 0;">WASM Environments & Assets</div>
        <span id="assets-chevron" style="font-size: 12px; color: #94a3b8; transition: transform 0.2s;">▼</span>
      </div>
      <div id="assets-container" style="margin-top: 10px; display: none;">
        <div style="display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px dashed #334155;">
          <span>🐍 Python (Pyodide WASI)</span>
          <span id="status-pyodide" style="padding: 2px 6px; border-radius: 4px; font-weight: 600; background: #374151; color: #9ca3af;">Not Downloaded</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px dashed #334155;">
          <span>⚡ QuickJS (JS/TS WASI)</span>
          <span id="status-quickjs" style="padding: 2px 6px; border-radius: 4px; font-weight: 600; background: #166534; color: #4ade80;">Downloaded (0.8 MB)</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0;">
          <span>🐧 container2wasm (Tier 2 OS)</span>
          <span id="status-container" style="padding: 2px 6px; border-radius: 4px; font-weight: 600; background: #374151; color: #9ca3af;">Not Downloaded</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">AI Language Classifier (BYOK)</div>
      <input type="password" id="byok-api-key" placeholder="Enter Gemini API Key" style="width: 90%; padding: 6px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 4px; margin-bottom: 8px;" />
      <button id="btn-save-byok" class="btn-action" style="background: #0284c7; margin-top: 4px;">Save BYOK Settings</button>
    </div>
    <button id="btn-clear-opfs" class="btn-action">Clear Storage Cache</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
